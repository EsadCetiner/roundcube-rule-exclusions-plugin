---
meta:
  author: "Esad Cetiner"
  description: "Roundcube Rule Exclusions Plugin"
rule_id: 9519115
tests:
  - test_id: 1
    desc: Allow application/octet-stream content type when switching to HTML mode in email composer
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: Roundcube rule exclusions plugin
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/octet-stream
          port: 80
          method: POST
          uri: /post?_task=utils&_action=text2html
          data: |-
            TEST
            test
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [920420]
  - test_id: 2
    desc: Allow application/octet-stream content type when switching to text mode in email composer
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: Roundcube rule exclusions plugin
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/octet-stream
          port: 80
          method: POST
          uri: /post?_task=utils&_action=html2text
          data: |-
            <h1 class="pre">test</h1>
            <h3 class="pre"><br /><br /><strong>test</strong></h3>
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [920420]
